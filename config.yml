media_folder: images
public_folder: /images
backend:
  name: git-gateway
  branch: main
publish_mode: simple
site_url: /
display_url: /
collections:
  - name: shop
    label: Shop
    files:
      - name: site
        label: Products, prices and delivery
        file: site.json
        fields:
          - label: WhatsApp number (start with 27, no + or spaces)
            name: whatsapp
            widget: string
          - label: Products
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Short description, name: desc, widget: string, required: false }
              - { label: Photo, name: image, widget: image, required: false, hint: "Use a photo less than 1MB" } 
              - { label: Price (only for items with ONE price), name: price, widget: number, value_type: int, required: false }
              - label: Lengths and prices (for items priced by length)
                name: lengths
                widget: list
                required: false
                summary: "{{fields.length}} inch - R{{fields.price}}"
                fields:
                  - { label: Length (inches), name: length, widget: number, value_type: int }
                  - { label: Price (R), name: price, widget: number, value_type: int }
              - { label: Extra cost to pluck and bleach knots (R), name: knots, widget: number, value_type: int, required: false }
              - { label: Price on request (shows an Ask for a price button), name: ask_price, widget: boolean, default: false, required: false }
          - label: Delivery options
            name: delivery
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name (include the days), name: name, widget: string }
              - { label: Price (R), name: fee, widget: number, value_type: int }
              - { label: Price is a "from" price, name: from, widget: boolean, default: false, required: false }
              - { label: Needs full home address (door to door), name: door, widget: boolean, default: false, required: false }
